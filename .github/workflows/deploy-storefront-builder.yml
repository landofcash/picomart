name: Deploy storefront builder

on:
  push:
    branches: [main]
    paths:
      - 'picomart-storefront-builder/**'
      - 'picomart-storefront-template/**'
      - 'tools/storefront-harness/**'
      - '.github/workflows/deploy-storefront-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let an active preparation/deployment finish, including sandbox cleanup.
concurrency:
  group: storefront-builder-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual preparation is available before automatic deployment is enabled.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.STOREFRONT_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: picomart.zkbytes.com / production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Check credentials and load deployment target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Set RAILWAY_TOKEN in the GitHub environment picomart.zkbytes.com / production.'; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const target = JSON.parse(fs.readFileSync('picomart-storefront-builder/deployment.json', 'utf8'));
          const settings = {
            RAILWAY_PROJECT_ID: target.projectId,
            RAILWAY_SANDBOX_ENVIRONMENT_ID: target.environmentId,
            RAILWAY_SERVICE_ID: target.serviceId,
          };
          for (const [key, value] of Object.entries(settings)) {
            if (!/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/.test(value)) throw new Error(`Invalid ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE

      - name: Install dependencies and Railway CLI
        run: |
          # Harness input validation imports schemas directly from this package.
          npm ci --prefix picomart-storefront-template
          npm ci --prefix tools/storefront-harness
          npm ci --prefix picomart-storefront-builder
          npm install --global @railway/cli@5.40.0

      - name: Validate harness and builder
        run: |
          npm run typecheck --prefix tools/storefront-harness
          npm test --prefix tools/storefront-harness
          npm run typecheck --prefix picomart-storefront-builder
          npm test --prefix picomart-storefront-builder
          npm run contracts:check --prefix picomart-storefront-builder
          npm run seller-contracts:check --prefix picomart-storefront-builder

      - name: Prepare fresh checkpoint and validate a sandbox build
        working-directory: tools/storefront-harness
        env:
          # The SDK uses RAILWAY_API_TOKEN even for project-token auth.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_AUTH_TYPE: project-token
        run: |
          npm run sandbox:prepare
          npm run sandbox:build

      - name: Package validated checkpoint
        run: |
          cp tools/storefront-harness/.state/environment.json picomart-storefront-builder/build-assets/environment.json
          npm run build-assets:sync --prefix picomart-storefront-builder
          npm run build-assets:check --prefix picomart-storefront-builder

      - name: Save prepared assets for this release
        uses: actions/upload-artifact@v4
        with:
          name: storefront-builder-assets-${{ github.sha }}-${{ github.run_attempt }}
          path: picomart-storefront-builder/build-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Deploy and wait for this deployment to succeed
        timeout-minutes: 20
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          scope=(--project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_SANDBOX_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID")
          # CLI 5.40.0 needs an absolute source path when its archive prefix is absolute.
          # Keep the repository as the archive root so Railway finds the service directory.
          cd "$GITHUB_WORKSPACE"
          upload_result="$RUNNER_TEMP/storefront-builder-upload.json"
          railway up "$GITHUB_WORKSPACE/picomart-storefront-builder" --detach --json "${scope[@]}" --message "GitHub ${GITHUB_SHA} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" | tee "$upload_result"
          if ! deployment_id=$(jq -er '.deploymentId | select(type == "string" and length > 0)' "$upload_result"); then
            echo 'Railway returned no deployment ID; inspect the upload response above.'
            exit 1
          fi
          echo "Deployment: $deployment_id"
          echo "Railway deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 100); do
            deployments=$(railway deployment list "${scope[@]}" --limit 100 --json)
            status=$(jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' <<< "$deployments")
            echo "Deployment $deployment_id: ${status:-not visible yet}"
            case "$status" in
              SUCCESS)
                echo "Deployment succeeded for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|REMOVING|SKIPPED|NEEDS_APPROVAL|SLEEPING)
                echo "Deployment did not succeed: $status. Inspect this deployment in Railway."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for Railway deployment success. Check the deployment before retrying.'
          exit 1
